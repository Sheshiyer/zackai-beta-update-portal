- soft felt lining
photography:
  style: Warm, natural light, playful compositions with children's environments, lifestyle
    family moments
  environment: Cozy kids' bedroom, play corner with soft textures, warm afternoon
    light, family living room
  constraint: No faces shown clearly. Hands and interaction focus. No clinical or
    cold settings. No screens visible.
  camera: Sony A7IV, 35mm, f/2.8, warm white balance
illustration:
  style: Rounded, friendly vector illustrations with soft gradients and warm colors
  references: Headspace illustration style meets Duolingo character warmth, Google
    Doodle playfulness
sigil:
  description: A round fluffy creature silhouette with pointed cat-like ears and glowing
    LED eyes
  components:
  - Round ball body silhouette (warmth, softness, approachability)
  - Pointed cat/fox ears (playfulness, curiosity)
  - Glowing LED eyes (AI intelligence, emotional connection)
audience:
  persona_name: The Intentional Parent
  aesthetic_affinity: clean design, warm minimalism, Scandinavian kids' decor
  aspirational_brands: Tonies, Yoto, LEGO, Montessori, Lovevery
  emotional_register: protective warmth, guilt-free screen alternative, learning joy
competitive_context:
  avoid_visual_patterns: cold tech aesthetics, robot imagery, screen-heavy visuals,
    clinical AI diagrams, teal/mint primary (Bondu), Poppins font (Bondu)
  differentiate_from: Bondu (same category, teal/mint, Poppins), Tonies (audio-only,
    no AI), Yoto (no conversational AI), Alexa Kids (screen-based, privacy concerns)
  occupy_territory: warm AI companion that parents trust — screen-free, multilingual,
    emotionally intelligent, animated LED personality
positioning:
  statement: For intentional parents in France who want their children aged 3-12 to
    learn, play, and grow through conversation rather than screens, ZackAI is the
    AI-powered plush companion that combines the warmth of a stuffed animal with the
    intelligence of a personal tutor. Unlike Bondu, which locks families into subscriptions,
    unlike Tonies and Yoto, which offer passive audio playback, and unlike smart speakers,
    which were never designed for children, ZackAI delivers adaptive, multilingual,
    conversational learning inside a huggable, screen-free form factor — certified
    safe under EU regulations, available in five bold colors led by Phantom Purple,
    and sold at EUR 99 with no subscription ever. ZackAI is not a gadget. It is the
    friend every curious child deserves.
  hero_headline: Screen-Free Playtime Companion
  identity_pillars:
  - screen-free learning
  - emotional intelligence
  - multilingual play
  - parent trust
  - animated LED personality
